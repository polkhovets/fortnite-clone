<!DOCTYPE html>
<html>
<head>
    <title>Fortnite-Style Game</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #ui {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
        }
        #resources {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Health: <span id="health">100</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>
    <div id="resources">
        <div>Wood: <span id="wood">0</span></div>
        <div>Stone: <span id="stone">0</span></div>
        <div>Metal: <span id="metal">0</span></div>
    </div>
    <script type="module" src="js/game.js"></script>
</body>
</html>
